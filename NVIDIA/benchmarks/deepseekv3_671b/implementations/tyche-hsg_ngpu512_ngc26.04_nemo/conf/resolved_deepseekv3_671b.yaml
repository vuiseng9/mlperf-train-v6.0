defaults:
  - _self_
  - model: 671b
  - data_prefix@data.data_prefix: benchmark_c4
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: '.'
  output_subdir: null


trainer:
  devices: 4
  num_nodes: 128
  max_steps: 100
  log_every_n_steps: 1

  val_check_interval: 1
  limit_val_batches: 1
  eval_batch_size: 1024  # limit validation to at most 1024 samples per batch

  warmup_train_steps: 3
  warmup_validation_steps: 3

data:
  dataset: 8b
  num_workers: 8
  dataloader_type: "single"
  path_to_cache: "/npy_index"
  reset_position_ids: False
  reset_attention_mask: False
  eod_mask_loss: False
  # Synthetic-data mode: when True (USE_SYNTHETIC_DATA=1 sets MOCK_DATASET=True),
  # MockGPTDataset is used for both train and validation, and the tokenizer is
  # swapped to NullTokenizer so the HF tokenizer mount is no longer required.
  mock_dataset: False
  mock_tokenizer_vocab_size: 129280

optim:
  lr: 0.000023238
  min_lr: 5e-6
  use_precision_aware_optimizer: True
  adam_eps: 1e-8
  sched:
    lr_warmup_iters: 4
    lr_decay_iters: 11996
  overlap_grad_reduce: True
  overlap_param_gather: True
  align_param_gather:  False
  use_distributed_optimizer: True
  bucket_size: 134217728
  fp8_param_gather: True
  fp4_param_gather: False
  reuse_grad_buf_for_mxfp8_param_ag: True
  num_distributed_optimizer_instances: 1
  outer_dp_sharding_strategy: no_shard
  nccl_ub_dp: False
  overlap_param_gather_with_optim_step: False

  # If true, manually register the FSDP communication buffers to NCCL user buffer.
  # This option is only effective when use_megatron_fsdp and nccl_ub is set.
  # For symmetric registration with large models, the registration itself can take
  # a significant amount of time. This option minimizes the number of registration calls
  # to minimize the registration time.
  fsdp_manual_registration: False
  optimizer_cuda_graph: True
  on_device_clip_grad: True

exp_manager:
  explicit_log_dir: '/results'
  load_optim: False
  load_rng_state: False
  save_optim: False
  save_rng_state: False
  async_save: False
  save_interval: -1  # if negative, do not save
  most_recent_k: 1
  # Base dir (mounted at /checkpoints); LOAD_CHECKPOINT is the container path to load from (e.g. /checkpoints/mbridge-ckpt)
  load_checkpoints_dir: null
  load_checkpoint: /checkpoints
  load_checkpoint_step: null  # specifies, which checkpoint to load; by default, load the latest checkpoint

custom:
  force_success_status: 0 # If True, sets the MLLOG status to SUCCESS at run_stop even if target accuracy was not reached so the dryrun report parsing works
  target_log_ppl: 3.6
